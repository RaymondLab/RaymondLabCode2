[project]
name = "RaymondLabCode2"
version = "0.1.0"
description = "Main codebase for Raymond Lab"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel",
    "matplotlib",
    "notebook",
    "numpy",
    "opencv-python>=5.0.0.93",
    "pandas",
    "PySide6",
    "pyqtgraph",
    "scipy",
    "sonpy>=1.9.12",
    "imageio-ffmpeg>=0.6.0",
    "comtypes>=1.4.16",
    "pyarrow>=25.0.1",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raymondlab"]        # hatchling ships every file under the package

[project.scripts]
rig-setup        = "raymondlab.apps.rig_setup:main"
#session-manager = "raymondlab.apps.session_manager:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]